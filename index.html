<style>
/* ═══════ 송쌤과학 중1 가상실험실 공통 껍데기 (체험버전 V2.11) ═══════
   ① 테마와 무관한 토큰 → ② 테마 토큰(두 블록, 같은 목록) → ③ 마감 기본층 → ④ 껍데기 부품
   실험실마다 달라지는 장면 토큰·배치는 각 실험실 src/app.css에 둔다. */
:root{
  --font-ui:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --font-title:var(--font-ui);
  --sp-1:4px;--sp-2:8px;--sp-3:12px;--sp-4:16px;--sp-5:20px;--sp-6:24px;--sp-8:32px;--sp-10:40px;
  --r-1:6px;--r-2:10px;--r-3:16px;--r-full:999px;        /* 작은 컨트롤 6 · 버튼·입력 10 · 패널·장면 16 · 상태 알약 full */
  --control-h:36px;--icon-size:18px;
  --dur-fast:140ms;--dur-ui:260ms;--dur-ui-out:180ms;--dur-layout:360ms;
  --ease-out:cubic-bezier(.2,0,0,1);--ease-in:cubic-bezier(.4,0,1,1);--lift:8px;
  --top-h:56px;--strip-h:0px;
  --light-angle:215deg;                                   /* 주 광원: 왼쪽 위 — UI 그림자는 오른쪽 아래로 */
  --brand-pink:#FFB7B2;--brand-ink:#3b1d1b;
  --yt-red:#ff0033;--yt-play:#ffffff;--ig-1:#feda75;--ig-2:#fa7e1e;--ig-3:#d62976;--ig-4:#4f5bd5;
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --surface-0:#0b131d;--surface-1:#101b28;--surface-2:#182636;
  --stage:#0e1a27;--stage-2:#132233;
  --text-1:#e8eff5;--text-2:#b0c0cf;--text-3:#8ea2b4;--line-1:#223445;--line-2:#34495d;
  --accent:#6fd3c1;--accent-strong:#9be7d9;--accent-soft:#163a3b;--on-accent:#08131c;--focus:#9be7d9;--scrim:#02070dcc;
  --danger:#ff9d8a;--danger-soft:#3b2322;--ok:#7ed7a0;--ok-soft:#1d3b32;--warn:#ffcf5c;--warn-soft:#3f3822;
  --data-1:#E69F00;--data-2:#56B4E9;--data-3:#2fbf92;--data-4:#CC79A7;
  --shadow-color:215 45% 3%;
  --shadow-1:0 0 #0000;
  --shadow-2:0 12px 32px -12px hsl(var(--shadow-color) / .6);
  --shadow-3:0 24px 64px -16px hsl(var(--shadow-color) / .7);
  --edge-hi:inset 0 1px 0 hsl(0 0% 100% / .06);
}
:root[data-theme="light"]{
  color-scheme:light;
  --surface-0:#edf1f4;--surface-1:#fbfcfd;--surface-2:#e3eaf0;
  --stage:#f5f8fa;--stage-2:#e9eff4;
  --text-1:#132a3b;--text-2:#44596b;--text-3:#566b7e;--line-1:#d3dde5;--line-2:#b2c3d0;
  --accent:#0f6b60;--accent-strong:#0a5148;--accent-soft:#d5eeea;--on-accent:#ffffff;--focus:#0a5148;--scrim:#0b1a2680;
  --danger:#b3261e;--danger-soft:#fbe3df;--ok:#1d7a47;--ok-soft:#d8f0e2;--warn:#8a5a00;--warn-soft:#fff2c8;
  --data-1:#B07400;--data-2:#0072B2;--data-3:#007A5A;--data-4:#A6508A;
  --shadow-color:210 30% 22%;
  --shadow-1:0 1px 2px hsl(var(--shadow-color) / .08);
  --shadow-2:0 1px 2px hsl(var(--shadow-color) / .06),0 10px 28px -10px hsl(var(--shadow-color) / .22);
  --shadow-3:0 2px 6px hsl(var(--shadow-color) / .08),0 24px 56px -16px hsl(var(--shadow-color) / .30);
  --edge-hi:0 0 #0000;
}
/* ③ 마감 기본층 (§6.8) */
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;accent-color:var(--accent)}
body{margin:0;background:var(--surface-0);color:var(--text-1);font:400 15px/1.65 var(--font-ui);font-synthesis:none;word-break:keep-all;overflow-wrap:break-word}
:root[data-theme="dark"] body{-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
h1,h2,h3,h4{text-wrap:balance;margin:0}
p,li,figcaption{text-wrap:pretty}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{font-size:max(16px,1em)}
button,a,[role="button"]{-webkit-tap-highlight-color:transparent;touch-action:manipulation}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
::selection{background:color-mix(in oklab,var(--accent) 30%,transparent)}
input,textarea{caret-color:var(--accent)}
*{scrollbar-width:thin;scrollbar-color:var(--line-2) transparent}
.scroll{overflow:auto;overscroll-behavior:contain;scrollbar-gutter:stable}
.num{font-variant-numeric:tabular-nums}
.unit{white-space:nowrap}
img,canvas,video{display:block;max-width:100%}
[hidden]{display:none!important}
dialog:not([open]){display:none}
[popover]:not(:popover-open){display:none}
.sr-only{position:absolute;left:0;top:0;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:8px;top:-60px;z-index:90;padding:8px 12px;border-radius:var(--r-1);background:var(--accent);color:var(--on-accent);text-decoration:none;font-weight:600}
.skip:focus{top:8px}
kbd{font:600 12px/1 ui-monospace,SFMono-Regular,Menlo,monospace;border:1px solid var(--line-2);border-bottom-width:2px;border-radius:5px;padding:3px 5px;color:var(--text-1);background:var(--surface-0)}
svg.ic{width:var(--icon-size);height:var(--icon-size);fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.muted{color:var(--text-2)}
/* ⑤ 사용자 설정 존중 */
@media (prefers-reduced-motion:reduce){:root{--lift:0px}}
@media (prefers-contrast:more){:root[data-theme]{--line-1:var(--line-2);--text-3:var(--text-2)}}
@media (prefers-reduced-transparency:reduce){.glass{backdrop-filter:none!important;-webkit-backdrop-filter:none!important;background:var(--surface-1)!important}}

/* ═══ 몸체: 상단 막대 / 본문 / (휴대폰) 브랜드 띠 ═══ */
html,body{height:100%}
body{height:100dvh;display:grid;grid-template-rows:var(--top-h) minmax(0,1fr) var(--strip-h);overflow:hidden}
.topbar{position:relative;z-index:30;display:flex;align-items:center;gap:12px;padding:0 10px 0 16px;background:var(--surface-1);border-bottom:1px solid var(--line-1);min-width:0}
.brand{display:flex;align-items:center;gap:8px;white-space:nowrap;flex:none}
.brandmark{width:27px;height:27px;border-radius:var(--r-2);background:var(--brand-pink);color:var(--brand-ink);display:grid;place-items:center;flex:none}
.brandmark svg.ic{width:17px;height:17px;stroke-width:2}
.word{font:700 13px/1 var(--font-ui);color:var(--text-1)}
.vdiv{width:1px;height:15px;background:var(--line-2);flex:none}
.social{position:relative;width:34px;height:34px;display:grid;place-items:center;border-radius:var(--r-1);color:var(--text-2);text-decoration:none;flex:none}
.social::before{content:'';position:absolute;inset:-5px}
.social svg{width:21px;height:21px}
.social .yt-body{fill:currentColor}.social .yt-play{fill:var(--surface-1)}
.social .ig-line{fill:none;stroke:currentColor;stroke-width:2}.social .ig-dot{fill:currentColor}
.social:is(:hover,:focus-visible) .yt-body{fill:var(--yt-red)}.social:is(:hover,:focus-visible) .yt-play{fill:var(--yt-play)}
.social:is(:hover,:focus-visible) .ig-line{stroke:url(#ig-grad)}.social:is(:hover,:focus-visible) .ig-dot{fill:var(--ig-3)}
.top-title{display:flex;align-items:baseline;gap:10px;min-width:0;flex:1 1 auto}
.top-title h1{font:700 15px/1.2 var(--font-ui);color:var(--text-1);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.top-title .std{font:500 12px/1 var(--font-ui);color:var(--text-2);white-space:nowrap}
.utilities{margin-left:auto;display:flex;align-items:center;gap:2px;flex:none}
.hsep{width:1px;height:20px;background:var(--line-1);margin:0 4px}
.icon-btn{position:relative;width:36px;height:36px;display:grid;place-items:center;border:0;border-radius:var(--r-2);background:transparent;color:var(--text-2);cursor:pointer;transition:background var(--dur-fast),color var(--dur-fast),transform var(--dur-fast)}
.icon-btn::before{content:'';position:absolute;inset:-4px}
.icon-btn svg.ic{width:20px;height:20px}
.icon-btn:active{transform:scale(.94)}
@media (hover:hover) and (pointer:fine){.icon-btn:hover,.social:hover{background:var(--surface-2);color:var(--text-1)}}
main.app{position:relative;min-width:0;min-height:0;overflow:hidden;outline:none}

/* ═══ 버튼 계층: Primary / Secondary / Ghost / Icon ═══ */
.btn{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:var(--control-h);padding:0 14px;border:1px solid var(--line-2);border-radius:var(--r-2);background:var(--surface-1);color:var(--text-1);font:600 13px/1.2 var(--font-ui);cursor:pointer;white-space:nowrap;transition:background var(--dur-fast),border-color var(--dur-fast),transform var(--dur-fast)}
.btn::before{content:'';position:absolute;inset:-4px 0}
.btn svg.ic{width:17px;height:17px}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:700}
.btn.ghost{background:transparent;border-color:transparent;color:var(--text-2)}
.btn.small{min-height:32px;padding:0 10px;font-size:13px}
.btn.wide{width:100%}
.btn[aria-disabled="true"],.btn:disabled{opacity:.5;cursor:not-allowed}
@media (hover:hover) and (pointer:fine){
  .btn:not(.primary):not(:disabled):hover{background:var(--surface-2)}
  .btn.primary:not(:disabled):hover{background:var(--accent-strong);border-color:var(--accent-strong)}
  .btn.ghost:hover{color:var(--text-1)}
}
/* 칩 · 세그먼트 */
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{position:relative;display:inline-flex;align-items:center;gap:6px;min-height:32px;padding:0 11px;border:1px solid var(--line-2);border-radius:var(--r-full);background:transparent;color:var(--text-1);font:500 13px/1 var(--font-ui);cursor:pointer;white-space:nowrap}
.chip::before{content:'';position:absolute;inset:-6px -2px}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--text-1);font-weight:700}
.chip[aria-pressed="true"]::after{content:'';width:6px;height:6px;border-radius:50%;background:var(--accent);order:-1}
.seg{display:inline-grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:2px;padding:3px;border-radius:var(--r-2);background:var(--surface-2);border:1px solid var(--line-1)}
.seg button{position:relative;min-height:30px;padding:0 12px;border:0;border-radius:7px;background:transparent;color:var(--text-2);font:600 13px/1.2 var(--font-ui);cursor:pointer;white-space:nowrap}
.seg button::before{content:'';position:absolute;inset:-6px -1px}
.seg button[aria-pressed="true"],.seg button[aria-selected="true"]{background:var(--surface-1);color:var(--text-1);font-weight:800;box-shadow:var(--edge-hi),0 1px 2px hsl(var(--shadow-color) / .18)}
@media (hover:hover) and (pointer:fine){.chip:hover{border-color:var(--text-2)}.seg button:not([aria-pressed="true"]):not([aria-selected="true"]):hover{color:var(--text-1)}}

/* 결과 저장 — 장면 모서리의 카메라 (Ghost/Icon 계층) */
.save-btn{position:relative;display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 11px 0 9px;border:1px solid var(--line-2);border-radius:var(--r-2);background:color-mix(in oklab,var(--surface-1) 88%,transparent);color:var(--text-1);font:600 13px/1 var(--font-ui);cursor:pointer;white-space:nowrap;box-shadow:var(--edge-hi)}
.save-btn::before{content:'';position:absolute;inset:-5px}
.save-btn svg.ic{width:18px;height:18px}
.save-btn[aria-busy="true"]{opacity:.6;cursor:progress}
@media (hover:hover) and (pointer:fine){.save-btn:hover{background:var(--surface-2)}}
.shutter{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;animation:shutter .32s var(--ease-out);z-index:5;border-radius:inherit}
@keyframes shutter{0%{opacity:.55}100%{opacity:0}}

/* 판독값 — 라벨 · 큰 수 · 작은 단위 */
.readout{display:flex;align-items:baseline;gap:4px;font-variant-numeric:tabular-nums}
.readout .v{font:800 26px/1.05 var(--font-ui);letter-spacing:-.02em;color:var(--text-1)}
.readout .u{font:600 13px/1 var(--font-ui);color:var(--text-2)}
.lbl{font:600 12px/1.4 var(--font-ui);color:var(--text-2)}

/* 슬라이더 (네이티브 range + accent-color, 트랙 4px 이상 · 터치 44px) */
input[type="range"]{width:100%;height:44px;margin:0;background:transparent;cursor:pointer;touch-action:pan-y}

/* ═══ 대화상자 · 드로어 · 토스트 ═══ */
dialog{border:0;padding:0;color:var(--text-1);background:var(--surface-1)}
dialog::backdrop{background:var(--scrim)}
.modal{width:min(620px,calc(100vw - 32px));max-height:min(86dvh,760px);border-radius:var(--r-3);box-shadow:var(--edge-hi),var(--shadow-3)}
.modal[open]{display:flex;flex-direction:column}
.modal.narrow{width:min(420px,calc(100vw - 32px))}
.drawer{margin:0 0 0 auto;height:100dvh;max-height:100dvh;width:clamp(360px,32vw,460px);border-left:1px solid var(--line-1);box-shadow:var(--shadow-3)}
.drawer[open]{display:flex;flex-direction:column}
.drawer::backdrop{background:color-mix(in oklab,var(--scrim) 55%,transparent)}
.dialog-head{display:flex;align-items:center;gap:8px;padding:12px 10px 12px 20px;border-bottom:1px solid var(--line-1);flex:none}
.dialog-head h2{font:800 18px/1.3 var(--font-ui);margin-right:auto}
.dialog-body{padding:16px 20px 22px;overflow:auto;overscroll-behavior:contain;scrollbar-gutter:stable}
.dialog-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
:is(dialog,[popover]).sheet{opacity:0;transform:translateY(var(--lift));transition:opacity var(--dur-ui-out) var(--ease-in),transform var(--dur-ui-out) var(--ease-in),overlay var(--dur-ui-out) allow-discrete,display var(--dur-ui-out) allow-discrete}
:is(dialog[open],[popover]:popover-open).sheet{opacity:1;transform:none;transition-duration:var(--dur-ui);transition-timing-function:var(--ease-out)}
@starting-style{:is(dialog[open],[popover]:popover-open).sheet{opacity:0;transform:translateY(var(--lift))}}
.drawer.sheet{transform:translateX(24px)}
.drawer.sheet[open]{transform:none}
@starting-style{.drawer.sheet[open]{transform:translateX(24px)}}
@media (prefers-reduced-motion:reduce){.drawer.sheet,.drawer.sheet[open]{transform:none}}
.help-doc h3{font:700 15px/1.4 var(--font-ui);margin:18px 0 6px;color:var(--text-1)}
.help-doc h3:first-child{margin-top:0}
.help-doc p,.help-doc li{font-size:15px;line-height:1.7;color:var(--text-1)}
.help-doc ul,.help-doc ol{margin:0;padding-left:20px}
.help-doc li+li{margin-top:4px}
.help-doc .keys{line-height:2.2}
.brandblock{margin-top:16px;padding:12px 14px;border-radius:var(--r-2);background:var(--surface-2);font-size:13px;line-height:1.8;color:var(--text-1)}
.brandblock a{color:var(--text-1)}
.ver-line{margin-top:10px;font:500 12px/1 var(--font-ui);color:var(--text-2)}
/* 원리 카드 */
.tcard{padding:0 0 18px;border-bottom:1px solid var(--line-1);margin-bottom:18px}
.tcard:last-child{border-bottom:0;margin-bottom:0}
.tcard h3{font:800 18px/1.35 var(--font-ui);margin:0 0 8px}
.tcard figure{margin:0 0 10px;border-radius:var(--r-2);background:var(--stage);border:1px solid var(--line-1);overflow:hidden}
.tcard figure svg{display:block;width:100%;height:auto}
.tcard .def{font:700 15px/1.6 var(--font-ui);margin-bottom:6px}
.tcard p{font-size:15px;line-height:1.7;color:var(--text-1)}
.tcard p+p{margin-top:6px}
.tcard .tb-list{margin:4px 0 0;padding:0 0 0 18px;display:grid;gap:5px}
.tcard .tb-list li{font-size:14px;line-height:1.6;color:var(--text-1)}
.tcard .tb-list b{font-weight:800}
.tcard .link{margin-top:10px;padding:10px 12px;border-left:3px solid var(--accent);background:var(--accent-soft);border-radius:0 var(--r-1) var(--r-1) 0;font-size:15px;line-height:1.65}
.toast{position:fixed;left:50%;bottom:calc(20px + var(--strip-h) + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:80;display:flex;align-items:center;gap:10px;max-width:min(360px,calc(100vw - 24px));padding:10px 14px;border-radius:var(--r-2);background:var(--surface-1);border:1px solid var(--line-2);box-shadow:var(--edge-hi),var(--shadow-2);font:500 13px/1.5 var(--font-ui);color:var(--text-1)}
.toast.error{border-color:var(--danger)}
.toast .toast-x{flex:none;width:30px;height:30px;display:grid;place-items:center;border:0;border-radius:var(--r-1);background:transparent;color:var(--text-2);cursor:pointer}
.textlink{display:inline-flex;align-items:center;gap:6px;color:var(--text-1);font:600 13px/1 var(--font-ui);text-decoration:underline;text-underline-offset:3px;padding:10px 0}
.textlink .yt-ic{width:20px;height:20px;stroke:none}
.textlink .yt-ic .yt-body{fill:var(--yt-red)}.textlink .yt-ic .yt-play{fill:#fff}

/* ═══ 휴대폰 세로(≤600px): 브랜드·채널은 아래 브랜드 띠로, 위에는 제목 + 고정 세트 ═══ */
@media (max-width:600px){
  :root{--top-h:52px;--strip-h:40px}
  .topbar{padding:0 4px 0 12px;gap:6px}

/* ═══════ 이 실험실 ═══════ */
/* 입자 모형 정리표 (보일·샤를 공용) */
.mc{display:flex;flex-direction:column;gap:10px}
.mc-q{font:700 15px/1.5 var(--font-ui);color:var(--text-1)}
.mc-go{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.mc-go .lbl{margin-right:2px}
.mc-rows{display:grid;gap:6px}
.mc-row{display:grid;grid-template-columns:minmax(96px,auto) minmax(0,1fr) 22px;align-items:center;gap:8px;padding:6px 8px;border:1px solid var(--line-1);border-radius:var(--r-2)}
.mc-row.ok{border-color:var(--ok);background:var(--ok-soft)}
.mc-row.no{border-color:var(--warn);background:var(--warn-soft)}
.mc-n{font:700 13px/1.3 var(--font-ui);color:var(--text-1)}
.mc-opts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px}
.mc-opts button{min-height:34px;padding:0 4px;border:1px solid var(--line-2);border-radius:var(--r-1);background:var(--surface-1);color:var(--text-1);font:600 13px/1.2 var(--font-ui);cursor:pointer;white-space:nowrap}
.mc-opts button[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);font-weight:800}
.mc-mk{display:grid;place-items:center;width:22px;height:22px;border-radius:50%;font:800 13px/1 var(--font-ui);color:var(--warn)}
.mc-row.ok .mc-mk{background:var(--ok);color:var(--surface-1)}
.mc-mk svg{width:13px;height:13px;stroke-width:2.6}
.mc-tip{grid-column:1 / -1;font:500 13px/1.5 var(--font-ui);color:var(--text-1)}
.mc-act{display:flex;align-items:center;gap:8px}
.mc-act .btn.primary{min-height:42px;padding:0 18px}
.mc-fb{font:500 14px/1.6 var(--font-ui);color:var(--text-1)}
.mc-fb b{font-weight:800}
@media (hover:hover) and (pointer:fine){.mc-opts button:not([aria-pressed="true"]):hover{border-color:var(--text-2)}}
@media (max-width:600px){.mc-row{grid-template-columns:minmax(0,1fr) 22px}.mc-opts{grid-column:1 / -1;grid-row:2}}

/* 보일 법칙 — 장면(주사기+확대 모형) 위, 부피·계기 아래 │ 오른쪽 그래프·기록표 (분할형) */
:root[data-theme="dark"]{
  --glass-hi:#e9f4fb;--glass:#9fc3d833;--glass-lo:#6d8ea3;--glass-edge:#8fb0c4;--grad-ink:#dbe6ef;
  --rub-hi:#5b636d;--rub:#23282e;--rod:#c9d4de;--rod-lo:#7d8a96;
  --gauge:#2d3946;--gauge-hi:#43515f;--gauge-lo:#1c242e;--gauge-ink:#b0c0cf;--btn-face:#56606b;--gauge-edge:#4b5b6c;--tube:#c9e3f18a;--tube-hi:#eef7fcb0;--tube-lo:#7fa6bd90;--tube-edge:#9cc3d6;--bench:#1d2632;--bench-hi:#2a3646;--bench-edge:#3d4c5e;--vblock:#3b4756;--vblock-edge:#56677a;--rod-hi:#eef3f7;--lcd:#0f2a1f;--lcd-t:#7ef0b0;--tube:#b0c0cf;
  --box:#122033;--box-edge:#5a7892;--gas-tint:#7ab8ff1f;
  --pt-hi:#d6ebff;--pt:#7ab8ff;--flash:#ffb547;--call:#6f879e;
}
:root[data-theme="light"]{
  --glass-hi:#ffffff;--glass:#cfe4f1a6;--glass-lo:#8fb3c9;--glass-edge:#6f93aa;--grad-ink:#23313d;
  --rub-hi:#6b737c;--rub:#2c3137;--rod:#eef3f7;--rod-lo:#8a99a6;
  --gauge:#3b4652;--gauge-hi:#56636f;--gauge-lo:#2a333d;--gauge-ink:#c9d4de;--btn-face:#8d98a5;--gauge-edge:#27313d;--tube:#d6ecf7b0;--tube-hi:#ffffffd0;--tube-lo:#8fb3c9b0;--tube-edge:#6f93aa;--bench:#cdd6de;--bench-hi:#e4eaef;--bench-edge:#b2c3d0;--vblock:#9aa7b4;--vblock-edge:#7d8a97;--rod-hi:#ffffff;--lcd:#163a2a;--lcd-t:#9dfcc6;--tube:#8a9aab;
  --box:#f2f7fb;--box-edge:#7d90a2;--gas-tint:#1f6fd11a;
  --pt-hi:#8cc1ff;--pt:#1f6fd1;--flash:#d97500;--call:#8a9cad;
}
.lab{height:100%;display:grid;grid-template-columns:minmax(0,1.55fr) minmax(340px,1fr);grid-template-rows:minmax(0,1fr) auto}
.stage-wrap{grid-column:1;grid-row:1;position:relative;min-height:0;background:var(--stage)}
.stage{position:absolute;inset:0}
#scene{position:absolute;inset:0;width:100%;height:100%;user-select:none;-webkit-user-select:none;touch-action:none}
.stage-tools{position:absolute;top:12px;right:12px;z-index:3}

/* 장면 */
.glass-hi-s{stop-color:var(--glass-hi)}.glass-s{stop-color:var(--glass)}.glass-lo-s{stop-color:var(--glass-lo)}
.barrel{fill:url(#barrelGrad);stroke:var(--glass-edge);stroke-width:.7}
.gas{fill:var(--gas-tint)}
.flange{fill:var(--glass-lo);opacity:.8;stroke:var(--glass-edge);stroke-width:.5}
.grad{stroke:var(--grad-ink);stroke-width:.35}.grad.mid{stroke-width:.45}.grad.maj{stroke-width:.6}
.grad-t{fill:var(--grad-ink);font-size:var(--t12);font-weight:600;text-anchor:middle;font-variant-numeric:tabular-nums}
.rub-hi-s{stop-color:var(--rub-hi)}.rub-s{stop-color:var(--rub)}
.rubber{fill:url(#rubberGrad)}
.rod{fill:url(#rodGradV);stroke:var(--rod-lo);stroke-width:.5}
.tube{fill:none;stroke:var(--tube);stroke-width:3.2;stroke-linecap:round}
.tube-in{fill:none;stroke:var(--stage);stroke-width:1.2;stroke-linecap:round}
.gauge{fill:url(#gaugeGrad);stroke:var(--gauge-edge);stroke-width:.8}
.gauge-hi-s{stop-color:var(--gauge-hi)}.gauge-s{stop-color:var(--gauge)}.gauge-lo-s{stop-color:var(--gauge-lo)}
.gauge-gloss{fill:#fff;opacity:.12}
.bezel{fill:var(--gauge-lo);stroke:#000;stroke-opacity:.35;stroke-width:.5}
.lcd-cap{fill:var(--lcd-t);opacity:.6;font:600 3.6px var(--font-ui);dominant-baseline:central}
.btn-ring{fill:var(--gauge-lo)}.btn-face{fill:var(--btn-face)}
.btn-t{fill:var(--gauge-ink);font:600 3.8px var(--font-ui);text-anchor:middle}
.port{fill:var(--rod-lo);stroke:var(--gauge-edge);stroke-width:.3}
.tube{fill:url(#tubeGrad);stroke:var(--tube-edge);stroke-width:.4}
.tube-hi-s{stop-color:var(--tube-hi)}.tube-s{stop-color:var(--tube)}.tube-lo-s{stop-color:var(--tube-lo)}
.tube-glint{stroke:#fff;stroke-width:.6;opacity:.55;stroke-linecap:round}
.bench{fill:url(#benchGrad)}.bench-edge{fill:var(--bench-edge)}
.bench-hi-s{stop-color:var(--bench-hi)}.bench-lo-s{stop-color:var(--bench)}
.shadow{fill:#000;opacity:.3}
.vblock{fill:var(--vblock);stroke:var(--vblock-edge);stroke-width:.5;stroke-linejoin:round}
.rod-web{fill:var(--rod-lo);fill-opacity:.32;stroke:var(--rod-lo);stroke-opacity:.7;stroke-width:.4}
.rod-glint{fill:#fff;opacity:.5}
.rub-ring{fill:var(--rub-hi)}
.rod-hi-s{stop-color:var(--rod-hi)}.rod-lo-s{stop-color:var(--rod-lo)}
.lcd{fill:var(--lcd)}
.lcd-t{fill:var(--lcd-t);font:700 12px ui-monospace,SFMono-Regular,Menlo,monospace;text-anchor:end;dominant-baseline:central}
.lcd-u{fill:var(--lcd-t);font:600 6px var(--font-ui);text-anchor:start;dominant-baseline:central}
.cap-s{fill:var(--text-2);font-size:var(--t12);font-weight:500}
.cap-s.mid{text-anchor:middle}
.cap-short{display:none}.small .cap-short{display:inline}.small .cap-long{display:none}
.box{fill:var(--box);stroke:var(--box-edge);stroke-width:.8}
.box-piston{fill:url(#rubberGrad)}
.pt-hi-s{stop-color:var(--pt-hi)}.pt-s{stop-color:var(--pt)}
.pt{fill:url(#ptGrad)}
.flash{stroke:var(--flash);stroke-width:2.2;stroke-linecap:round}
.call{stroke:var(--call);stroke-width:.6;stroke-dasharray:2 2;fill:none}
.handle{cursor:ew-resize;outline:none}
.handle .hit{fill:transparent}
.handle:focus-visible .ring{opacity:1}
.ring{fill:none;stroke:var(--focus);stroke-width:1.2;opacity:0}
.grip{fill:url(#rodGradV);stroke:var(--rod-lo);stroke-width:.6}
.grip-arrow{fill:none;stroke:var(--text-2);stroke-width:1.1;stroke-linecap:round;stroke-linejoin:round}

/* 조작·계기 */
.ctl{grid-column:1;grid-row:2;display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1.2fr) auto;gap:0;border-top:1px solid var(--line-1);background:var(--surface-1)}
.ctl>*{padding:12px 16px}
.ctl>*+*{border-left:1px solid var(--line-1)}
.pred{grid-column:1 / -1;border-left:0!important;border-bottom:1px solid var(--line-1);display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 16px}
.pred:empty{display:none}
.pred .q{font:600 15px/1.4 var(--font-ui);color:var(--text-1);margin-right:auto}
.pred .res{font:500 15px/1.5 var(--font-ui);color:var(--text-1)}
.pred .res b{font-weight:800}
.vol{display:flex;flex-direction:column;gap:2px}
.vtop{display:flex;align-items:baseline;justify-content:space-between}
.vtop .readout .v{font-size:28px}
.meters{display:grid;grid-template-columns:1fr;gap:6px}
.meters .m{display:grid;grid-template-columns:auto 1fr;align-items:baseline;gap:2px 10px}
.meters .m .lbl{grid-column:1 / -1}
.meters .readout .v{font-size:28px}
.meters .readout .v.sm{font-size:20px}
.lbl-note{font-weight:500;margin-left:4px}
.bar{height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden;align-self:center}
.bar i{display:block;height:100%;width:0;background:var(--flash);transition:width .3s var(--ease-out)}
.recw{display:flex;flex-direction:column;justify-content:center;gap:6px;min-width:170px}
.recw .btn{min-height:46px;font-size:15px}
.rhint{font:500 12px/1.4 var(--font-ui);color:var(--text-2);max-width:170px}

/* 그래프·기록표 */
.data{grid-column:2;grid-row:1 / span 2;display:flex;flex-direction:column;min-height:0;padding:12px 18px 14px;border-left:1px solid var(--line-1);background:var(--surface-1)}
.g-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.dtabs{align-self:flex-start;margin-bottom:10px;flex:none}
.dmain{display:flex;flex-direction:column;flex:1;min-height:0}
.dmain[hidden],#mcBox[hidden]{display:none}
#mcBox{flex:1;min-height:0;overflow:auto;padding-right:4px}
.cap{font:700 15px/1.3 var(--font-ui);color:var(--text-1)}
#graph{width:100%;height:auto;max-height:52%;flex:none}
.g-grid{stroke:var(--line-1);stroke-width:1}.g-axis{stroke:var(--line-2);stroke-width:1.2}
.g-t{fill:var(--text-2);font:500 12px var(--font-ui);font-variant-numeric:tabular-nums}
.g-title{fill:var(--text-1);font:600 12px var(--font-ui)}
.g-pt{fill:var(--data-1);stroke:var(--surface-1);stroke-width:1.5}
.g-fit{fill:none;stroke:var(--data-1);stroke-width:1.6;stroke-dasharray:6 4}
.g-now{fill:none;stroke:var(--text-1);stroke-width:1.4;stroke-dasharray:2 2}
.find{font:500 15px/1.55 var(--font-ui);color:var(--text-1);min-height:46px;margin:6px 0 8px}
.tbl-scroll{flex:1;min-height:0}
table.rec{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
table.rec th{position:sticky;top:0;background:var(--surface-1);font:600 12px/1.3 var(--font-ui);color:var(--text-2);text-align:right;padding:6px 10px;border-bottom:1px solid var(--line-2)}
table.rec td{font:500 15px/1.3 var(--font-ui);color:var(--text-1);text-align:right;padding:7px 10px;border-bottom:1px solid var(--line-1)}
table.rec tr.fresh td{animation:fresh .9s var(--ease-out)}
@keyframes fresh{0%{background:var(--accent-soft)}100%{background:transparent}}
.empty-row td{color:var(--text-2)!important;font-size:13px!important;text-align:left!important}

@media (max-width:1180px){.ctl{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.recw{grid-column:1 / -1;border-left:0!important;border-top:1px solid var(--line-1);flex-direction:row;align-items:center}.rhint{max-width:none}}
@media (max-width:860px){
  main.app{overflow:auto}
  .lab{height:auto;grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto auto}
  .stage-wrap{grid-row:1;position:sticky;top:0;z-index:4;aspect-ratio:330/196;border-bottom:1px solid var(--line-1)}
  .ctl{grid-row:2;grid-template-columns:minmax(0,1fr)}
  .ctl>*+*{border-left:0;border-top:1px solid var(--line-1)}
  .data{grid-column:1;grid-row:3;border-left:0;border-top:1px solid var(--line-1)}
  #graph{max-height:none}
}
@media (max-width:600px){
  .save-btn{width:44px;height:44px;padding:0;justify-content:center}.save-btn .save-l{display:none}
  .stage-tools{top:auto;bottom:6px;right:6px}
  .ctl>*{padding:10px 12px}
  .recw{flex-direction:column;align-items:stretch}
}

</style>

const SS = (() => {

    flask: '<path d="M9 3h6m-5 0v6L4.5 19A2 2 0 0 0 6.3 22h11.4a2 2 0 0 0 1.8-3L14 9V3M7.5 15h9"/>',

  /* ── 테마 (§11 — 스위치는 html[data-theme] 하나) ── */
  function applyTheme(t) {

  }

  /* ── 전체화면 ── */
  function toggleFull() {

  function openHelp() {

      <h3>단축키</h3><p class="keys"><kbd>F</kbd> 전체화면 · <kbd>D</kbd> 다크/라이트 · <kbd>H</kbd> 도움말 · <kbd>C</kbd> 결과 저장 · <kbd>Esc</kbd> 창 닫기·전체화면 나가기${h.keys ? '<br>' + h.keys : ''}</p>
      <h3>결과 저장</h3><p>장면 오른쪽 위 <b>결과 저장</b>(또는 <kbd>C</kbd>)을 누르면 지금 보이는 장면과 그 순간의 조건·값이 담긴 PNG 한 장이 기기의 다운로드 폴더에 저장돼요(iPad는 저장 확인 창이 떠요).</p>
      <h3>모형의 조건과 한계</h3>${h.model}
      <h3>출처와 제작</h3>${h.source}
      <h3>기록 지우기</h3><p>실험 기록과 진행 상태는 이 탭에만 남고, 탭을 닫으면 지워져요.${h.local ? ' ' + h.local : ''}</p>
      <button class="btn" id="wipeBtn">${icon('trash')}이 실험실의 기록 모두 지우기</button>
      <div class="brandblock">🧪 송쌤과학 (Song Ssaem Science)<br>ⓒ 2026 송세호 | 아주중학교<br>📺 YouTube: <a href="${CHANNELS.yt}" target="_blank" rel="noopener noreferrer" aria-label="송쌤과학 유튜브 채널 (새 창)">@songsamscience</a>&nbsp; 📷 Instagram: <a href="${CHANNELS.ig}" target="_blank" rel="noopener noreferrer" aria-label="송쌤과학 인스타그램 (새 창)">@songsamscience</a><br>⚠ 무단 복제·상업적 이용 금지</div>
      <p class="ver-line">v${CFG.version} · ${CFG.date}</p></div>`, {
      onOpen: () => {
        $('#wipeBtn').onclick = () => openModal('기록을 모두 지울까요?', `<p>${h.wipe || '이 실험실의 기록과 진행 상태'}가 모두 지워져요. 테마 설정은 남아요.</p>
          <div class="dialog-actions"><button class="btn" data-close>그대로 두기</button><button class="btn primary" id="wipeYes">모두 지우기</button></div>`, {
          narrow: true, onOpen: () => {

  /* ── 결과 저장 (§11): SVG 장면 복제 → 계산된 스타일 인라인 → 이미지 → 캔버스 + 정보 띠 → PNG ── */
  const INLINE_PROPS = ['fill', 'fill-opacity', 'fill-rule', 'stroke', 'stroke-width', 'stroke-opacity', 'stroke-dasharray', 'stroke-dashoffset', 'stroke-linecap', 'stroke-linejoin', 'stroke-miterlimit', 'opacity', 'font-family', 'font-size', 'font-weight', 'font-style', 'text-anchor', 'dominant-baseline', 'paint-order', 'stop-color', 'stop-opacity', 'display', 'visibility', 'letter-spacing', 'font-variant-numeric', 'mix-blend-mode', 'filter', 'clip-path', 'mask', 'transform', 'transform-origin', 'transform-box'];
  function inlineTree(src, dst) {

      const v = cs.getPropertyValue(p);
      if (p === 'transform' && (v === 'none' || !src.style.transform)) continue;   // CSS transform만 옮긴다(속성 transform은 그대로 있음)
      if ((p === 'transform-origin' || p === 'transform-box') && !src.style.transform) continue;
      if (v !== '' && v !== 'normal' && v !== 'none' || p === 'fill' || p === 'stroke' || (p === 'display' && v === 'none')) st += `${p}:${v};`;   // 숨긴 요소는 PNG에서도 숨긴다
    }
    dst.setAttribute('style', st); dst.removeAttribute('class');
    const a = src.children, b = dst.children;
    for (let i = 0; i < a.length && i < b.length; i++) inlineTree(a[i], b[i]);
  }
  function svgToImage(svg, outW, vbOverride) {
    const clone = svg.cloneNode(true);
    inlineTree(svg, clone);
    clone.querySelectorAll('[data-noexport]').forEach(e => e.remove());
    clone.querySelectorAll('[tabindex]').forEach(e => e.removeAttribute('tabindex'));
    const vb = vbOverride || svg.viewBox.baseVal;
    const outH = Math.round(outW * vb.height / vb.width);
    clone.setAttribute('viewBox', `${vb.x} ${vb.y} ${vb.width} ${vb.height}`);
    clone.setAttribute('width', outW); clone.setAttribute('height', outH); clone.setAttribute('xmlns', NS);
    clone.setAttribute('preserveAspectRatio', 'xMidYMid meet');
    const data = new XMLSerializer().serializeToString(clone);
    const url = URL.createObjectURL(new Blob([data], { type: 'image/svg+xml;charset=utf-8' }));
    return new Promise((ok, no) => { const img = new Image(); img.onload = () => { URL.revokeObjectURL(url); ok({ img, w: outW, h: outH }); }; img.onerror = e => { URL.revokeObjectURL(url); no(e); }; img.src = url; });
  }
  function wrapText(ctx, text, maxW) {
    const words = String(text).split(' '), lines = []; let line = '';
    for (const w of words) { const t = line ? line + ' ' + w : w; if (ctx.measureText(t).width > maxW && line) { lines.push(line); line = w; } else line = t; }
    if (line) lines.push(line);
    return lines;
  }
  const p2 = n => String(n).padStart(2, '0');
  async function capture() {
    const btn = $('#saveBtn');
    if (!btn || btn.offsetParent === null || btn.getAttribute('aria-busy') === 'true') return;
    const cap = CFG.capture && CFG.capture();
    if (!cap || !cap.svg) return;
    btn.setAttribute('aria-busy', 'true');

    try {
      const css = getComputedStyle(document.documentElement), tok = n => css.getPropertyValue(n).trim();
      const svg = cap.svg, vb = cap.viewBox || svg.viewBox.baseVal;
      const r = svg.getBoundingClientRect(), fit = Math.min(r.width / svg.viewBox.baseVal.width, r.height / svg.viewBox.baseVal.height);
      const outW = Math.round(Math.min(2400, Math.max(1200, vb.width * fit * 2)));
      const g = await svgToImage(svg, outW, cap.viewBox);
      const cv = document.createElement('canvas'), ctx = cv.getContext('2d');
      const k = outW / 1200, pad = 28 * k, font = n => `${n}px 'Pretendard Variable', Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif`;
      ctx.font = `500 ${font(17 * k)}`;
      const rightW = 300 * k, textW = outW - pad * 3 - rightW;
      const condL = wrapText(ctx, cap.cond, textW), stateL = wrapText(ctx, cap.state, textW);
      const bandH = pad * 2 + 50 * k + (condL.length + stateL.length) * 26 * k;
      cv.width = outW; cv.height = Math.round(g.h + bandH);
      ctx.fillStyle = tok(cap.bg || '--stage'); ctx.fillRect(0, 0, outW, g.h);
      ctx.drawImage(g.img, 0, 0, g.w, g.h);
      ctx.fillStyle = tok('--surface-1'); ctx.fillRect(0, g.h, outW, cv.height - g.h);
      ctx.fillStyle = tok('--line-2'); ctx.fillRect(0, g.h, outW, Math.max(1, k));
      let y = g.h + pad + 14 * k;
      ctx.textBaseline = 'alphabetic';
      ctx.fillStyle = tok('--text-2'); ctx.font = `600 ${font(14 * k)}`; ctx.fillText('실험 결과 · 송쌤과학 가상실험실', pad, y);
      y += 30 * k; ctx.fillStyle = tok('--text-1'); ctx.font = `800 ${font(22 * k)}`; ctx.fillText(cap.title || CFG.title, pad, y);
      ctx.font = `500 ${font(17 * k)}`; ctx.fillStyle = tok('--text-1');
      for (const l of condL) { y += 26 * k; ctx.fillText(l, pad, y); }
      ctx.fillStyle = tok('--text-2');
      for (const l of stateL) { y += 26 * k; ctx.fillText(l, pad, y); }
      const now = new Date();
      ctx.textAlign = 'right'; let ry = g.h + pad + 30 * k; const rx = outW - pad;
      ctx.fillStyle = tok('--text-2'); ctx.font = `500 ${font(15 * k)}`;
      ctx.fillText(`${now.getFullYear()}-${p2(now.getMonth() + 1)}-${p2(now.getDate())} ${p2(now.getHours())}:${p2(now.getMinutes())}`, rx, ry); ry += 26 * k;
      ctx.fillText('© 송쌤과학 · @songsamscience', rx, ry);
      ctx.textAlign = 'left';
      const blob = await new Promise(ok => cv.toBlob(ok, 'image/png'));
      if (!blob) throw new Error('blob');
      const fname = `${CFG.file}_실험결과_${now.getFullYear()}${p2(now.getMonth() + 1)}${p2(now.getDate())}-${p2(now.getHours())}${p2(now.getMinutes())}.png`.replace(/[\\/:*?"<>|\s]/g, '');
      const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = fname; document.body.appendChild(a); a.click();
      setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
      window.__lastCapture = { name: fname, w: cv.width, h: cv.height, url: cv.toDataURL('image/png') };
      if (!REDUCED && cap.flashEl) { const f = document.createElement('div'); f.className = 'shutter'; cap.flashEl.appendChild(f); setTimeout(() => f.remove(), 340); }
      toast(`실험 결과를 PNG로 저장했어요 — ${fname}`);
    } catch (e) {
      console.error(e);
      toast('이미지로 저장하지 못했어요. 기기의 화면 캡처를 이용해 주세요.', { error: true });
    } finally { clearTimeout(slow); btn.removeAttribute('aria-busy'); }
  }

  /* ── 애니메이션 루프: rAF + 델타 타임, 탭이 숨으면 멈춤 ── */
  function loop(step) {
    let last = 0, id = 0, on = true;
    const f = t => { if (!on) return; const dt = last ? Math.min(0.05, (t - last) / 1000) : 0; last = t; step(dt); id = requestAnimationFrame(f); };
    const vis = () => { if (document.hidden) { cancelAnimationFrame(id); last = 0; } else if (on) { last = 0; id = requestAnimationFrame(f); } };
    document.addEventListener('visibilitychange', vis);
    id = requestAnimationFrame(f);
    return { stop() { on = false; cancelAnimationFrame(id); document.removeEventListener('visibilitychange', vis); } };
  }

  /* ── SVG 작은 도구 ── */
  function el(tag, attrs = {}, parent) {
    const e = document.createElementNS(NS, tag);

/* ═══════ 기체 입자 모형 엔진 (보일·샤를 공용) ═══════
   확대 모형 상자 안의 같은 크기·같은 질량 원판 입자. 벽·피스톤과 탄성 충돌, 입자끼리 탄성 충돌.
   - 입자 수는 늘 같다(닫힌 용기). 입자 크기도 늘 같다.
   - 온도 = 입자 빠르기: uniform이면 같은 온도에서 모든 입자가 같은 빠르기로 움직인다(교과서 입자 모형).
     입자끼리 부딪혀 방향이 바뀌어도 빠르기는 그 온도의 값으로 되돌린다. 온도가 바뀌면 모든 입자가 함께 빨라지거나 느려진다.
   - 피스톤 벽에 부딪힌 횟수를 기록해 최근 2초 평균(초당)을 낸다.
   상자 좌표: x 0..W, y 0..H. 피스톤 벽은 axis('x' → x = L 쪽, 'y' → y = 0 쪽이 아니라 L 쪽)에 있다. */
const Gas = (() => {
  function rng(seed) { let s = seed >>> 0; return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; }; }
  function create(o) {
    const R = rng(o.seed || 7), g = { n: o.n, r: o.r, W: o.W, H: o.H, axis: o.axis || 'x', L: o.L, v: o.v, uniform: !!o.uniform, p: [], hits: [], t: 0, flashes: [] };
    const lenX = () => g.axis === 'x' ? g.L : g.W, lenY = () => g.axis === 'x' ? g.H : g.L;
    for (let i = 0, tries = 0; i < g.n && tries < 5000; tries++) {
      const x = g.r + R() * (lenX() - 2 * g.r), y = g.r + R() * (lenY() - 2 * g.r);
      if (g.p.some(q => (q.x - x) ** 2 + (q.y - y) ** 2 < (2.2 * g.r) ** 2)) continue;
      const a = R() * Math.PI * 2; g.p.push({ x, y, vx: Math.cos(a) * g.v, vy: Math.sin(a) * g.v }); i++;
    }
    return g;
  }
  /* 피스톤 위치(L) 바꾸기: 밖으로 나간 입자는 안으로 들이고 피스톤 쪽으로 가던 속도는 되돌린다(속력은 그대로 — 온도 일정) */
  function setL(g, L) {
    g.L = L;
    for (const q of g.p) {
      if (g.axis === 'x') { if (q.x > L - g.r) { q.x = Math.max(g.r, L - g.r - 1e-3); if (q.vx > 0) q.vx = -q.vx; } }
      else if (q.y > L - g.r) { q.y = Math.max(g.r, L - g.r - 1e-3); if (q.vy > 0) q.vy = -q.vy; }
    }
  }
  /* 모든 입자의 빠르기를 g.v로 맞춘다(방향은 그대로) */
  function equalize(g) { for (const q of g.p) { const s = Math.hypot(q.vx, q.vy); if (s > 1e-9) { q.vx *= g.v / s; q.vy *= g.v / s; } else { const a = (q.x * 7.13 + q.y * 3.7) % (Math.PI * 2); q.vx = Math.cos(a) * g.v; q.vy = Math.sin(a) * g.v; } } }
  /* 빠르기를 v로(온도 변화). uniform이면 모든 입자를 바로 v로, 아니면 평균 빠르기를 조금씩 */
  function setSpeed(g, v, k = 1) {
    if (g.uniform) { g.v = v; equalize(g); return; }
    const cur = Math.sqrt(g.p.reduce((a, q) => a + q.vx * q.vx + q.vy * q.vy, 0) / g.p.length) || v;
    const f = 1 + (v / cur - 1) * k;
    for (const q of g.p) { q.vx *= f; q.vy *= f; }
    g.v = v;
  }
  function step(g, dt) {
    const n = Math.max(1, Math.ceil(dt * 240)), h = dt / n, r = g.r, X = g.axis === 'x' ? g.L : g.W, Y = g.axis === 'x' ? g.H : g.L;
    for (let s = 0; s < n; s++) {
      g.t += h;
      for (const q of g.p) {
        q.x += q.vx * h; q.y += q.vy * h;
        if (q.x < r) { q.x = 2 * r - q.x; q.vx = Math.abs(q.vx); }
        if (q.x > X - r) { q.x = 2 * (X - r) - q.x; q.vx = -Math.abs(q.vx); if (g.axis === 'x') hit(g, q); }
        if (q.y < r) { q.y = 2 * r - q.y; q.vy = Math.abs(q.vy); }
        if (q.y > Y - r) { q.y = 2 * (Y - r) - q.y; q.vy = -Math.abs(q.vy); if (g.axis === 'y') hit(g, q); }
      }
      for (let i = 0; i < g.p.length; i++) for (let j = i + 1; j < g.p.length; j++) {        // 같은 질량 원판의 탄성 충돌
        const a = g.p[i], b = g.p[j], dx = b.x - a.x, dy = b.y - a.y, d2 = dx * dx + dy * dy, m = 2 * r;
        if (d2 >= m * m || d2 === 0) continue;
        const d = Math.sqrt(d2), nx = dx / d, ny = dy / d, rel = (b.vx - a.vx) * nx + (b.vy - a.vy) * ny;
        const ov = (m - d) / 2; a.x -= nx * ov; a.y -= ny * ov; b.x += nx * ov; b.y += ny * ov;
        if (rel < 0) { a.vx += rel * nx; a.vy += rel * ny; b.vx -= rel * nx; b.vy -= rel * ny; }
      }
      if (g.uniform) equalize(g);                                    // 부딪혀도 빠르기는 온도가 정한 값 그대로
    }
    while (g.hits.length && g.hits[0] < g.t - 2) g.hits.shift();
    g.flashes = g.flashes.filter(f => g.t - f.t < .3);
  }
  function hit(g, q) { g.hits.push(g.t); g.flashes.push({ t: g.t, at: g.axis === 'x' ? q.y : q.x }); }
  const rate = g => g.hits.length / Math.min(2, Math.max(.5, g.t));    // 최근 2초 평균 (초당)
  const speeds = g => g.p.map(q => Math.hypot(q.vx, q.vy));
  return { create, setL, setSpeed, step, rate, speeds };
})();

/* ───────── 입자 모형 정리표 (보일·샤를 공용) ─────────
   교과서의 ‘입자 모형으로 해석하기’ 활동처럼 (가)→(나)에서
   입자의 크기·개수·운동 빠르기·충돌이 어떻게 되는지 고르고, 장면의 입자 모형으로 확인한다.

  const { icon, announce, store, toast } = SS;
  function create(o) {
    const key = o.key || 'mc', root = o.mount;
    const fresh = () => ({ pick: {}, checked: false });
    let st = Object.assign(fresh(), store.get(key, {}));
    const save = () => store.set(key, st);

        <div class="mc-rows">${o.rows.map((r, i) => `<div class="mc-row${res ? (res[i] ? ' ok' : ' no') : ''}" role="group" aria-label="${r.name}">
            <span class="mc-n">${r.name}</span>
            <span class="mc-opts">${r.opts.map((t, j) => `<button data-mcr="${r.id}" data-j="${j}" aria-pressed="${st.pick[r.id] === j}">${t}</button>`).join('')}</span>
            <span class="mc-mk" aria-hidden="true">${res ? (res[i] ? icon('check') : '?') : ''}</span>
            ${res && !res[i] ? `<span class="mc-tip">${r.tip}</span>` : ''}
          </div>`).join('')}</div>
        <div class="mc-act"><button class="btn primary" data-mcact="check" aria-disabled="${nPicked() < o.rows.length}">${icon('check')}확인하기</button><button class="btn ghost small" data-mcact="reset">${icon('reset')}다시 고르기</button></div>
        <p class="mc-fb" aria-live="polite">${allOk ? `<b>모두 맞았어요.</b> ${o.summary}` : res ? `${res.filter(Boolean).length}/${o.rows.length} 맞았어요. ? 표시한 줄은 장면의 입자 모형을 다시 볼까요?` : `${o.rows.length}줄을 모두 고르면 확인할 수 있어요. 위의 두 단추로 장면을 (가)·(나)로 바꿔 보며 골라요.`}</p>`;
    }
    function refocus(sel) { const b = root.querySelector(sel); if (b) b.focus(); }

      const g = e.target.closest('[data-mcgo]');

      const r = e.target.closest('[data-mcr]');
      if (r) { st.pick[r.dataset.mcr] = +r.dataset.j; st.checked = false; save(); render(); refocus(`[data-mcr="${r.dataset.mcr}"][data-j="${r.dataset.j}"]`); return; }

    });

  }

})();

  source: '<p>2022 개정 중학교 과학 ‘기체의 성질’ — [9과06-01] 압력의 의미를 알고, 기체의 압력을 입자의 운동으로 설명할 수 있다. [9과06-02] 기체의 압력과 부피 관계를 실험 결과로부터 알아내고, 이를 입자 모형으로 해석할 수 있다. </p><p>중학교 과학 교과서의 탐구(주사기와 압력 센서), 입자 모형 해석 활동, 생활 속 예를 바탕으로 만들었고, 그림은 모두 새로 그렸어요. 이전 판(보일의 법칙 인포그래픽)을 주사기 실험으로 다시 만들었어요.</p>',
  wipe: '기록표, 그래프, 예측, 주사기 부피, 입자 모형 정리',
};

/* ═════════ 이벤트 · 시작 ═════════ */
function capture() {
  const rows = [...recs].sort((a, b) => b.V - a.V);
  return { svg, flashEl: $('#stage'),
    cond: `끝을 막은 주사기 · 온도 일정 · 기체의 부피 ${Math.round(S.V)} mL`,
    state: `압력 ${f2(pres(S.V))} 기압 · 피스톤 벽 충돌 ${Gas.rate(gas).toFixed(1)}번/초(입자 모형)${rows.length ? ` · 기록: ${rows.map(r => `${r.V} mL ${f2(r.P)}`).join(', ')}` : ''}` };
}
function sizeText() {
  const r = svg.getBoundingClientRect(); if (!r.width) return;
  pxu = Math.min(r.width / 330, r.height / 196);
  for (const n of [12, 13, 15]) svg.style.setProperty(`--t${n}`, `${(n / pxu).toFixed(2)}px`);
  svg.style.setProperty('--h3', `${(3 / pxu).toFixed(3)}px`);
  svg.classList.toggle('small', pxu < 1.6);
  render();
}
function bind() {
  $('#recBtn').innerHTML = `${icon('record')}기록하기`;
  $('#undoBtn').innerHTML = `${icon('undo')}마지막 기록 지우기`;
  $('#recBtn').onclick = record;
  $('#undoBtn').onclick = () => { if (!recs.length) return; recs.pop(); save(); renderTable(); renderGraph(); syncCtl(); announce('마지막 기록을 지웠어요.'); };
  $('#volRng').addEventListener('input', e => { anim = null; setV(+e.target.value); });
  $('#volRng').addEventListener('change', () => { save(); renderGraph(); });
  $$('.ctl [data-v]').forEach(c => c.addEventListener('click', () => animateTo(+c.dataset.v)));
  $('#dataSeg').addEventListener('click', e => { const b = e.target.closest('[role=tab]'); if (b) setDTab(b.dataset.v); });
  $('#dataSeg').addEventListener('keydown', e => { if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') { e.preventDefault(); setDTab(dTab === 'g' ? 'm' : 'g'); $(`#dataSeg [data-v="${dTab}"]`).focus(); } });
  $('#pred').addEventListener('click', e => {
    if (e.target.closest('[data-tomc]')) { setDTab('m'); $('#mcBox').scrollTop = 0; return; }
    const b = e.target.closest('[data-pred]'); if (!b) return;
    const k = b.dataset.pred;
    if (k === 'close') S.predClosed = true; else S.pred = k;
    save(); renderPred(); checkPred();
  });
}
buildStatic(); bind();
/* ── 입자 모형 정리표 (교과서의 ‘기체의 압력에 따른 부피 변화를 입자 모형으로 해석하기’ 활동) ── */
let dTab = store.get('dtab', 'g');
function setDTab(v) {
  dTab = v; store.set('dtab', v);
  $$('#dataSeg [role=tab]').forEach(b => { b.setAttribute('aria-selected', String(b.dataset.v === v)); b.tabIndex = b.dataset.v === v ? 0 : -1; });
  $('#dMain').hidden = v !== 'g'; $('#mcBox').hidden = v !== 'm';
  if (v === 'g') renderGraph(); else mc.render();
}
const mc = ModelCheck.create({
  mount: $('#mcBox'), key: 'mc',
  question: '일정한 온도에서 피스톤을 눌러 기체의 부피를 (가) 40 mL에서 (나) 20 mL로 줄였어요. (나)에서는 어떻게 될까요?',
  states: [{ id: 'a', label: '(가) 40 mL' }, { id: 'b', label: '(나) 20 mL' }],
  current: () => Math.round(S.V) === 40 ? 'a' : Math.round(S.V) === 20 ? 'b' : null,
  go: id => { animateTo(id === 'a' ? 40 : 20); },
  rows: [
    { id: 'size', name: '입자의 크기', opts: ['커져요', '그대로', '작아져요'], ans: 1, tip: '입자 모형에서 (가)와 (나)의 공 크기를 비교해 보세요. 입자 하나하나는 변하지 않아요.' },
    { id: 'count', name: '입자의 개수', opts: ['많아져요', '그대로', '적어져요'], ans: 1, tip: '주사기 끝이 막혀 있어 입자가 드나들 수 없어요. 모형의 입자 수를 세어 보세요.' },
    { id: 'speed', name: '입자의 운동 빠르기', opts: ['빨라져요', '그대로', '느려져요'], ans: 1, tip: '온도가 일정해요. 입자가 움직이는 빠르기를 (가)와 (나)에서 비교해 보세요.' },
    { id: 'dist', name: '입자 사이의 거리', opts: ['멀어져요', '그대로', '가까워져요'], ans: 2, tip: '같은 수의 입자가 더 좁은 공간에 들어 있으면 입자 사이는 어떻게 될까요?' },
    { id: 'hits', name: '벽에 충돌하는 횟수', opts: ['늘어요', '그대로', '줄어요'], ans: 0, tip: '‘피스톤 벽에 부딪힌 횟수’ 계기를 (가)와 (나)에서 비교해 보세요.' },
    { id: 'pres', name: '기체의 압력', opts: ['커져요', '그대로', '작아져요'], ans: 0, tip: '압력계 값을 (가)와 (나)에서 비교해 보세요.' },
  ],
  summary: '일정한 온도에서 기체에 작용하는 압력이 커지면 입자의 크기·개수·운동 빠르기는 그대로이고, 입자 사이의 거리가 가까워져요. 그래서 입자가 벽에 충돌하는 횟수가 늘어 기체의 압력이 커지고, 기체의 부피는 줄어들어요.',
});
SS.init({
  id: 'boyle-lab', title: '보일 법칙 — 기체의 압력과 부피', file: '보일법칙_압력과부피', version: APP_VERSION, date: APP_DATE,
  help: HELP, theory, capture, onResize: sizeText,
  onWipe: () => { mc.wipe(); setDTab('g'); S = { V: V0, pred: null, predShown: false, predDone: false }; recs = []; anim = null; Gas.setL(gas, V0 * MM_PER_ML * ZOOM); render(); renderPred(); renderTable(); renderGraph(); },
});
renderPred(); renderTable(); sizeText(); renderGraph();
SS.loop(dt => { step(dt); mc.sync(); });
setDTab(dTab);
window.BoyleLab = { mc, setDTab, setV, animateTo, record, step, gas, state: () => ({ S, recs, P: pres(S.V), rate: Gas.rate(gas) }) };

</script>
